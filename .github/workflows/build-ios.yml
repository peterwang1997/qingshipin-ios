# 轻视频 iOS —— GitHub Actions 打包未签名 ipa
# 用途：在没有 Mac、没有付费开发者账号的情况下，用 GitHub 的 macOS 虚拟机编译出 ipa，
#       再在 Windows 上用 Sideloadly 配免费 Apple ID 自签安装（有效期 7 天，到期重签）。
#
# 触发方式：推送到 main 分支，或在仓库 Actions 页面手动 Run workflow
#
# 说明：
#   - 本流程不签名，因此任何工程签名配置都不会导致失败
#   - 若以后有付费开发者账号，可改用带证书的签名版流程（另存一份即可，不要混在这个文件里）

name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show scheme
        run: |
          xcodebuild -project 轻视频iOS.xcodeproj -list

      - name: Build unsigned
        run: |
          xcodebuild \
            -project 轻视频iOS.xcodeproj \
            -scheme 轻视频iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package into ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app path: $APP"
          if [ -z "$APP" ]; then echo "未找到 .app，编译失败"; exit 1; fi
          rm -rf payload
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          cd payload
          zip -r ../轻视频iOS-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: 轻视频iOS-unsigned
          path: 轻视频iOS-unsigned.ipa
          if-no-files-found: error
