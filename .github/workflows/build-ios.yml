# 轻视频 iOS —— 编译未签名 ipa
# 用途：没有 Mac、没有付费开发者账号时，用 GitHub 的 macOS 虚拟机编出 ipa，
#       再在 Windows 上用 Sideloadly 等工具配免费 Apple ID 自签安装（7 天有效，到期重签）。
#
# 触发：推送到 main、手动 Run workflow、或创建 tag。
# 工程用 XcodeGen 描述，构建时现场生成 .xcodeproj，仓库里不放工程文件。

name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project Qingshipin.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Qingshipin.xcodeproj \
            -scheme Qingshipin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Package into ipa
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "未找到 .app，编译失败"; exit 1; fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "version: $VERSION"
          rm -rf payload
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          cd payload
          zip -r -y "../qingshipin-ios-v${VERSION}.ipa" Payload
          cd ..
          ls -lh ./*.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Qingshipin-ios-ipa
          path: qingshipin-ios-*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
