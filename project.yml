name: 轻视频iOS
options:
  bundleIdPrefix: com.qingshipin
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: 轻视频iOS/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.qingshipin.ios

targets:
  轻视频iOS:
    type: application
    platform: iOS
    sources:
      - path: 轻视频iOS
    info:
      path: 轻视频iOS/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
